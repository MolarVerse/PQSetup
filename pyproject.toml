[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pqsetup"
version = "0.1.0"
description = "Prepare and validate PQ simulation inputs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "MolarVerse" },
]
requires-python = ">=3.11"
dependencies = [
  "ase>=3.23",
  "fastapi>=0.115",
  "numpy>=2.0",
  "pydantic>=2.10",
  "python-multipart>=0.0.18",
  "scipy>=1.13",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27",
  "pytest>=8.0",
]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
]

[project.scripts]
pqsetup = "pqsetup.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pqsetup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: runs PQ with an installed external runner",
]
