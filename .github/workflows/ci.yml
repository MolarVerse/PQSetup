name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[test]"

      - name: Test
        run: python -m pytest

      - name: Build wheel
        if: runner.os == 'Linux'
        run: python -m pip wheel --no-deps . --wheel-dir dist

      - name: Smoke-test wheel
        if: runner.os == 'Linux'
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          pqsetup --version
          pqsetup --help

  interface:
    name: Interface
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm --prefix frontend ci

      - name: Test
        run: npm --prefix frontend test

      - name: Build
        run: npm --prefix frontend run build

      - name: Check bundled interface
        run: git diff --exit-code -- pqsetup/static
