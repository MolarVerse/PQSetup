name: Design package

on:
  push:
    tags:
      - "pq-design-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify tag and version
        env:
          DESIGN_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          version=$(node -p "require('./frontend/packages/pq-design/package.json').version")
          test "$DESIGN_TAG" = "pq-design-v$version"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and test the design package
        working-directory: frontend
        run: |
          npm ci
          npm run build -w @molarverse/pq-design
          npm test
          mkdir -p ../dist
          npm pack -w @molarverse/pq-design --pack-destination ../dist
      - name: Verify independent install
        run: |
          archive=$(find dist -name '*.tgz' -print -quit)
          node frontend/packages/pq-design/scripts/verify-package.mjs "$archive"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DESIGN_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum ./*.tgz > SHA256SUMS
          gh release create "$DESIGN_TAG" ./*.tgz ./SHA256SUMS \
            --title "PQ design ${DESIGN_TAG#pq-design-v}" \
            --notes "Versioned flat-mono tokens, CSS and React primitives for PQSetup, PQViewer and PQEnalyzer Web." \
            --latest=false \
            --verify-tag \
            --repo "$GITHUB_REPOSITORY"
